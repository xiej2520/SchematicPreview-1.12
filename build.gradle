plugins {
    id 'fabric-loom' version '1.17+'
    id 'ploceus' version '1.17+'
    id 'maven-publish'
}

group = project.mod_id
version = project.mod_version

base
{
    archivesName = project.mod_file_name + '-' + project.minecraft_version_out
}

repositories
{
    mavenLocal()
}

dependencies
{
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(ploceus.mcpMappings("stable", "1.12", "39"))

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"

    ploceus.dependOsl(project.osl_version)

    modImplementation "malilib:malilib-ornithe-${project.minecraft_version_out}:${project.malilib_version}"
    modImplementation "litematica:litematica-ornithe-${project.minecraft_version_out}:${project.litematica_version}"
}

loom
{
    decompilers
    {
        vineflower
        {
            options.put("ind", "    ")
        }
    }
}

processResources
{
    inputs.property "mod_version", version

    filesMatching("fabric.mod.json")
    {
        expand "mod_version": version
    }
}

tasks.withType(JavaCompile).configureEach
{
    options.encoding = "UTF-8"
    options.release = 8
}

tasks.withType(AbstractArchiveTask).configureEach
{
    preserveFileTimestamps = true
}

java
{
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

publishing
{
    publications
    {
        mavenJava(MavenPublication)
        {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
