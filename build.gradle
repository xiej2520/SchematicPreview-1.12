plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'ploceus' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

group = project.mod_id
version = project.mod_version

if (version.endsWith('-dev'))
{
    version = version + "." + new Date().format('yyyyMMdd.HHmmss')
}

base
{
    archivesName = project.mod_file_name + '-' + project.minecraft_version_out
}

def generatedVersionDir = file("$buildDir/generated/sources/version")

sourceSets
{
    main
    {
        java.srcDir generatedVersionDir
    }
}

tasks.register("generateVersionSource")
{
    inputs.property "mod_version", version
    outputs.dir generatedVersionDir

    doLast
    {
        File output = file("$generatedVersionDir/dev/froyln/schematicpreview/BuildVersion.java")
        output.parentFile.mkdirs()
        output.text = """package dev.froyln.schematicpreview;

public final class BuildVersion
{
    public static final String VERSION = \"${version}\";

    private BuildVersion() {}
}
"""
    }
}

repositories
{
    mavenLocal()
}

dependencies
{
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(ploceus.mcpMappings("stable", "1.12", "39"))

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    // Ploceus' aggregate OSL metadata endpoint currently returns an empty
    // module list for the 1.12.2 aggregate.  Declare the three modules used
    // by this project explicitly instead; these are the same modules selected
    // by the OSL 0.16.3 aggregate at runtime.
    modImplementation "net.ornithemc.osl:core:0.6.0"
    modImplementation "net.ornithemc.osl:entrypoints:0.4.3+mc13w16a-04192037-mc1.14.4"
    modImplementation "net.ornithemc.osl:lifecycle-events:0.5.6+mc13w36a-09051446-mc1.13"
    modImplementation "net.ornithemc.osl:resource-loader:0.5.4+mc16w32a-mc1.12.2"

    // Build against the locally produced Ornithe libraries from the sibling
    // workspaces, without requiring private Maven publication first.
    modImplementation files(project.malilib_jar)
    modImplementation files(project.litematica_jar)
}

loom
{
    decompilers
    {
        vineflower
        {
            options.put("ind", "    ")
        }
    }
}

processResources
{
    inputs.property "mod_version", version

    filesMatching("fabric.mod.json")
    {
        expand "mod_version": version
    }
}

tasks.withType(JavaCompile).configureEach
{
    dependsOn tasks.named("generateVersionSource")
    options.encoding = "UTF-8"
    options.release = 8
}

tasks.withType(AbstractArchiveTask).configureEach
{
    dependsOn tasks.named("generateVersionSource")
    preserveFileTimestamps = true
}

java
{
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

publishing
{
    publications
    {
        mavenJava(MavenPublication)
        {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
